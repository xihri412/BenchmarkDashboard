[project]
name = "benchmark-dashboard-backend"
version = "0.1.0"
description = "FastAPI backend for BenchmarkDashboard."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "SQLAlchemy==2.0.36",
  "alembic==1.14.0",
  "pydantic-settings==2.7.1",
  "psycopg[binary]==3.2.3",
]

[tool.uvicorn]
factory = false
